# Two tiers (docs/release-plan.md §2.10):
# - quick: every PR push runs the type check, unit tests, cargo test and
#   clippy, plus shellcheck on scripts/release. No release build, no e2e.
# - full: pushes to main, manual runs, and PRs labelled `e2e` also build
#   the release binary, run e2e against that exact binary, upload it and
#   attest it. The Zo box pulls that artifact with `make release-fetch`.
# No secrets, no pull_request_target.
name: build

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Labelling a PR with anything other than `e2e` gets its own group, so it
  # can't cancel a run that's in progress for that PR.
  group: build-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'e2e' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    # Other labels don't need a run.
    if: github.event.action != 'labeled' || github.event.label.name == 'e2e'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # The PR head commit, not GitHub's synthetic merge commit, so the
      # artifact's sha is a real branch commit we can promote after merge.
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_TERM_COLOR: always
      FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'bun.lock', 'frontend/bun.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Version stamp
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          {
            echo "FASTRETRO_GIT_SHA=$HEAD_SHA"
            echo "FASTRETRO_GIT_TREE=$(git rev-parse 'HEAD^{tree}')"
            echo "FASTRETRO_BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      - name: Install JS dependencies
        run: |
          bun install --frozen-lockfile
          (cd frontend && bun install --frozen-lockfile)

      - name: Frontend build
        run: cd frontend && bun run build

      - name: Frontend type check
        run: cd frontend && bun run check

      - name: Frontend unit tests
        run: cd frontend && bun run test:unit

      - name: shellcheck release scripts
        run: cd scripts/release && shellcheck --version | head -2 && shellcheck *.sh lib.sh

      - name: Guide clip size budget
        run: shellcheck scripts/guide-clips.sh scripts/check-guide-clips.sh && scripts/check-guide-clips.sh

      - name: Rust toolchain
        run: rustup show active-toolchain && rustc --version && cargo --version

      - name: cargo test
        run: cargo test --locked

      - name: Clippy (warning count reported, not gated)
        run: |
          cargo clippy --locked --all-targets 2>&1 | tee clippy.log
          n=$(grep '^warning: ' clippy.log | grep -vc ' generated [0-9]* warning' || true)
          echo "clippy warnings: ${n:-0}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Quick tier note
        if: env.FULL != 'true'
        run: echo "Quick checks only. Add the \`e2e\` label to this PR for the release build, e2e and a deployable artifact." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Release build
        if: env.FULL == 'true'
        run: cargo build --release --locked

      - name: Install Playwright Chromium
        if: env.FULL == 'true'
        run: bunx playwright install --with-deps chromium

      - name: e2e against the release binary
        if: env.FULL == 'true'
        run: FASTRETRO_BIN=target/release/fast-retro ./test-local.sh

      - name: Upload e2e report on failure
        if: failure() && env.FULL == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ env.HEAD_SHA }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Pack dist
        if: env.FULL == 'true'
        env:
          # Branch names are attacker-controlled on fork PRs: pass via env,
          # never interpolate into the script.
          BUILD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          BUILD_EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p dist
          cp target/release/fast-retro dist/fast-retro
          cp frontend/build/index.html dist/index.html
          jq -n \
            --arg sha "$FASTRETRO_GIT_SHA" \
            --arg tree "$FASTRETRO_GIT_TREE" \
            --arg ref "$BUILD_REF" \
            --arg event "$BUILD_EVENT" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_url "$RUN_URL" \
            --arg built_at "$FASTRETRO_BUILT_AT" \
            --arg runner_image "${ImageOS:-unknown}-${ImageVersion:-unknown}" \
            --arg rustc "$(rustc --version)" \
            --arg bun "$(bun --version)" \
            --arg binary_sha256 "$(sha256sum dist/fast-retro | cut -d' ' -f1)" \
            --arg index_sha256 "$(sha256sum dist/index.html | cut -d' ' -f1)" \
            '{source: "ci", sha: $sha, tree: $tree, ref: $ref, event: $event,
              run_id: $run_id, run_attempt: $run_attempt, run_url: $run_url,
              built_at: $built_at, runner_image: $runner_image, rustc: $rustc,
              bun: $bun, binary_sha256: $binary_sha256, index_sha256: $index_sha256}' \
            > dist/BUILD_INFO
          cat dist/BUILD_INFO

      - name: Upload artifact
        if: env.FULL == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fast-retro-${{ env.HEAD_SHA }}
          path: dist/
          retention-days: 90
          if-no-files-found: error

  attest:
    needs: gates
    # Full-tier, same-repo runs only. Fork PRs get no OIDC token, so they
    # never carry a valid attestation and can't be fetched onto the box.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fast-retro-${{ env.HEAD_SHA }}
          path: dist

      - name: Check binary against BUILD_INFO
        run: |
          test "$(jq -r .sha dist/BUILD_INFO)" = "$HEAD_SHA"
          test "$(jq -r .source dist/BUILD_INFO)" = "ci"
          echo "$(jq -r .binary_sha256 dist/BUILD_INFO)  dist/fast-retro" | sha256sum -c -
          echo "$(jq -r .index_sha256 dist/BUILD_INFO)  dist/index.html" | sha256sum -c -

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/fast-retro
